name: CI/CD Pipeline - Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Test Frontend Build
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Validate Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile app/main.py

  deploy:
    name: Deploy to EC2 via Docker Compose
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: SSH into EC2 & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            APP_DIR="$HOME/ComplianceGuard"

            echo "=== 1. Checking deployment directory ==="
            if [ ! -d "$APP_DIR" ]; then
              echo "Cloning repository..."
              git clone https://github.com/RAHULku784/-ComplianceGuard.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            echo "=== 2. Pulling latest changes from main branch ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== 3. Deploying with Docker Compose ==="
            # Ensure Docker Compose plugin or binary is available
            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            else
              COMPOSE_CMD="docker-compose"
            fi

            $COMPOSE_CMD down --remove-orphans || true
            $COMPOSE_CMD up -d --build

            echo "=== 4. Cleaning up old unused Docker images ==="
            docker image prune -f

            echo "=== 5. Verifying running containers ==="
            $COMPOSE_CMD ps

            echo "=== Deployment to EC2 completed successfully! ==="
